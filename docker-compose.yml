version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quality_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: factory_password_2026
      POSTGRES_DB: quality_inspection
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: quality_fastapi_service
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:factory_password_2026@postgres:5432/quality_inspection
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: .
    container_name: quality_streamlit_app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:factory_password_2026@postgres:5432/quality_inspection
    depends_on:
      - api
      - postgres

volumes:
  postgres_data:
